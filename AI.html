
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#212121">
<title>RJF8 AI</title>
<style>
:root{
  --bg:#212121;--side:#171717;--panel:#303030;--hover:#2b2b2b;
  --text:#ececec;--muted:#a5a5a5;--border:#383838;
  --accent:#10a37f;--input:#303030;--bubble:#303030;
}
body.light{
  --bg:#ffffff;--side:#f9f9f9;--panel:#f4f4f4;--hover:#ececec;
  --text:#242424;--muted:#707070;--border:#e4e4e4;
  --accent:#0d9875;--input:#ffffff;--bubble:#f4f4f4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  height:100dvh;overflow:hidden;font-size:14px;
}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
.app{height:100dvh;display:flex;direction:rtl}
.sidebar{
  width:260px;min-width:260px;background:var(--side);
  display:flex;flex-direction:column;padding:12px;
  transition:transform .25s,width .25s;z-index:20;
}
.brand{display:flex;align-items:center;justify-content:space-between;padding:5px 3px 19px}
.brand-name{font-size:21px;font-weight:800;letter-spacing:-.7px}
.brand-name span{color:var(--accent)}
.icon-btn{
  border:0;background:transparent;border-radius:9px;
  width:36px;height:36px;display:inline-flex;align-items:center;
  justify-content:center;font-size:19px;flex-shrink:0;
}
.icon-btn:hover,.nav-btn:hover,.chat-item:hover{background:var(--hover)}
.nav-btn{
  border:0;background:transparent;border-radius:9px;padding:11px;
  text-align:right;display:flex;gap:11px;align-items:center;
  width:100%;margin-bottom:4px;
}
.nav-btn .ico{font-size:18px;width:23px;text-align:center}
.search-wrap{margin:5px 0 10px;position:relative}
.search-wrap input{
  width:100%;background:var(--panel);color:var(--text);
  border:1px solid transparent;border-radius:9px;padding:11px 12px;
  outline:none;
}
.search-wrap input:focus{border-color:var(--accent)}
.section-title{font-size:12px;color:var(--muted);padding:13px 8px 8px}
.history{overflow:auto;flex:1;min-height:0}
.chat-item{
  display:flex;align-items:center;gap:5px;border-radius:8px;
  padding:10px 9px;cursor:pointer;position:relative;min-width:0;
}
.chat-item.active{background:var(--panel)}
.chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-menu{border:0;background:transparent;opacity:.6;padding:2px 5px;border-radius:5px}
.chat-menu:hover{opacity:1;background:var(--hover)}
.empty-history{color:var(--muted);padding:12px 8px;font-size:12px;line-height:1.8}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:9px;margin-top:8px}
.profile{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px}
.avatar{
  width:35px;height:35px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--accent);color:white;font-weight:bold;
}
.profile-info{flex:1;min-width:0}
.profile-info strong{display:block;font-size:13px}
.profile-info small{display:block;color:var(--muted);margin-top:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
  height:59px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;flex-shrink:0;
}
.top-right,.top-left{display:flex;align-items:center;gap:8px}
.mobile-brand{display:none;font-weight:bold;font-size:18px}
.model-button{
  background:transparent;border:0;border-radius:9px;padding:9px 11px;
  font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;
}
.model-button:hover{background:var(--hover)}
.model-menu{
  display:none;position:absolute;top:51px;right:15px;background:var(--panel);
  border:1px solid var(--border);border-radius:12px;padding:7px;
  width:235px;z-index:30;box-shadow:0 8px 28px #0003;
}
.model-menu.show{display:block}
.model-option{
  width:100%;border:0;background:transparent;text-align:right;padding:12px;
  border-radius:8px;display:flex;justify-content:space-between;gap:8px;
}
.model-option:hover{background:var(--hover)}
.model-option small{color:var(--muted);display:block;margin-top:5px}
.chat-area{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.messages{max-width:790px;margin:0 auto;padding:18px 22px 32px}
.welcome{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:35px 0 20px;
}
.logo-mark{
  width:55px;height:55px;border-radius:19px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:900;margin-bottom:20px;
  box-shadow:0 7px 25px #10a37f25;
}
.welcome h1{font-size:28px;margin:0 0 11px;text-align:center}
.welcome p{color:var(--muted);text-align:center;line-height:1.9;margin:0 0 27px}
.suggestions{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:570px;
}
.suggestion{
  background:transparent;border:1px solid var(--border);border-radius:13px;
  padding:15px;text-align:right;line-height:1.8;transition:.15s;
}
.suggestion:hover{background:var(--hover);border-color:var(--accent)}
.suggestion strong{display:block;margin-bottom:4px;font-size:13px}
.suggestion span{color:var(--muted);font-size:12px}
.message{display:flex;gap:12px;margin:24px 0;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.message-avatar{
  width:32px;height:32px;min-width:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.message.assistant .message-avatar{background:var(--accent);color:white;font-weight:bold}
.message.user .message-avatar{background:var(--panel)}
.message-body{min-width:0;max-width:calc(100% - 44px);line-height:1.95;overflow-wrap:anywhere}
.message.user .message-body{
  background:var(--bubble);padding:10px 15px;border-radius:18px;
  max-width:82%;white-space:pre-wrap;
}
.message-content{white-space:pre-wrap;line-height:2}
.message-content strong{font-weight:700}
.message-content pre{
  direction:ltr;text-align:left;overflow:auto;background:var(--side);
  border:1px solid var(--border);padding:14px;border-radius:10px;
}
.message-content code{font-family:Consolas,monospace}
.message-content a{color:var(--accent)}
.message-actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.message-actions button{
  border:0;background:transparent;border-radius:7px;padding:5px 8px;
  color:var(--muted);font-size:13px;
}
.message-actions button:hover{background:var(--hover);color:var(--text)}
.typing{display:flex;gap:5px;padding:9px 0}
.typing i{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.composer-zone{padding:8px 20px 14px;flex-shrink:0}
.composer-wrap{max-width:790px;margin:auto}
.attachment-preview{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.attachment{
  display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--panel);border:1px solid var(--border);border-radius:9px;
  max-width:100%;font-size:12px;
}
.attachment span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment button{border:0;background:transparent}
.composer{
  border:1px solid var(--border);background:var(--input);border-radius:25px;
  padding:11px 13px 9px;box-shadow:0 3px 14px #00000008;
}
.composer:focus-within{border-color:color-mix(in srgb,var(--border),var(--text) 20%)}
#prompt{
  width:100%;resize:none;max-height:190px;min-height:32px;outline:none;
  border:0;background:transparent;color:var(--text);line-height:1.8;
  padding:3px 5px;direction:rtl;
}
#prompt::placeholder{color:var(--muted)}
.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.tools-right,.tools-left{display:flex;align-items:center;gap:5px}
.tool-btn{
  height:35px;min-width:35px;border:0;border-radius:50%;
  background:transparent;display:flex;align-items:center;justify-content:center;
  font-size:18px;padding:0 9px;
}
.tool-btn:hover{background:var(--hover)}
.send-btn{background:var(--text);color:var(--bg);font-size:19px;font-weight:bold}
.send-btn:hover{opacity:.8}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
#fileInput{display:none}
.disclaimer{text-align:center;color:var(--muted);font-size:10px;margin:10px 0 0;line-height:1.8}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:10px 16px;z-index:100;box-shadow:0 5px 25px #0002;
  display:none;max-width:90%;text-align:center;
}
.context-menu{
  position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:5px;width:155px;box-shadow:0 5px 25px #0004;
}
.context-menu button{
  display:block;width:100%;text-align:right;padding:10px;border:0;
  background:transparent;border-radius:7px;
}
.context-menu button:hover{background:var(--hover)}
.context-menu .danger{color:#ef7777}
.overlay{display:none}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:13px 0;border-bottom:1px solid var(--border);
}
.settings-row select,.settings-row input{
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:8px;max-width:55%;
}
.primary-btn{
  border:0;background:var(--accent);color:white;border-radius:9px;
  padding:10px 15px;font-weight:bold;
}
.secondary-btn{
  border:1px solid var(--border);background:transparent;
  color:var(--text);border-radius:9px;padding:9px 12px;
}
.dialog-backdrop{
  display:none;position:fixed;inset:0;background:#0008;z-index:90;
  align-items:center;justify-content:center;padding:18px;
}
.dialog-backdrop.show{display:flex}
.dialog{
  background:var(--bg);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:440px;padding:22px;max-height:85dvh;overflow:auto;
}
.dialog h2{font-size:19px;margin:0 0 17px}
.dialog p{line-height:1.9;color:var(--muted)}
.dialog-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}
.dialog input{
  width:100%;padding:11px;border:1px solid var(--border);
  background:var(--input);color:var(--text);border-radius:9px;outline:none;
}
.settings-content{line-height:1.8}
@media(max-width:700px){
  .sidebar{
    position:fixed;right:0;top:0;bottom:0;height:100dvh;
    transform:translateX(105%);width:min(290px,85vw);
    box-shadow:none;
  }
  .sidebar.open{transform:translateX(0);box-shadow:-10px 0 40px #0005}
  .overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:15}
  .mobile-brand{display:block}
  .topbar{padding:0 10px}
  .model-button{font-size:14px;padding:8px}
  .messages{padding:10px 13px 25px}
  .welcome h1{font-size:23px}
  .welcome p{font-size:13px}
  .suggestions{grid-template-columns:1fr}
  .suggestion{padding:11px 13px}
  .composer-zone{padding:7px 9px 9px}
  .message{gap:8px;margin:20px 0}
  .message-body{max-width:calc(100% - 40px)}
  .message.user .message-body{max-width:88%}
  .disclaimer{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">RJF8 <span>AI</span></div>
      <button class="icon-btn" id="closeSidebar" title="بستن منو">☰</button>
    </div>

    <button class="nav-btn" id="newChatBtn"><span class="ico">✚</span> چت جدید</button>
    <button class="nav-btn" id="searchBtn"><span class="ico">⌕</span> جست‌وجوی گفتگوها</button>
    <button class="nav-btn" id="exploreBtn"><span class="ico">✧</span> ایده‌های پیشنهادی</button>

    <div class="search-wrap" id="searchWrap" hidden>
      <input id="searchInput" type="search" placeholder="جست‌وجو در گفتگوها...">
    </div>

    <div class="section-title">گفتگوهای اخیر</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button class="nav-btn" id="themeBtn"><span class="ico" id="themeIcon">☼</span><span id="themeText">حالت روشن</span></button>
      <button class="nav-btn" id="settingsBtn"><span class="ico">⚙</span> تنظیمات</button>
      <button class="nav-btn" id="exportAllBtn"><span class="ico">⇩</span> خروجی گفتگوها</button>
      <div class="profile">
        <div class="avatar">R</div>
        <div class="profile-info"><strong>RJF8 AI</strong><small>دستیار شخصی تو</small></div>
        <button class="icon-btn" id="profileBtn" title="درباره">⋯</button>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="top-right">
        <button class="icon-btn" id="menuBtn" title="منو">☰</button>
        <span class="mobile-brand">RJF8 AI</span>
        <button class="model-button" id="modelBtn">RJF8 AI <span>⌄</span></button>
        <div class="model-menu" id="modelMenu">
          <button class="model-option" data-model="RJF8 AI">
            <span><strong>RJF8 AI</strong><small>دستیار همه‌کاره</small></span><span>✓</span>
          </button>
          <button class="model-option" data-model="RJF8 Creative">
            <span><strong>RJF8 Creative</strong><small>ایده‌پردازی و نویسندگی</small></span><span></span>
          </button>
          <button class="model-option" data-model="RJF8 Study">
            <span><strong>RJF8 Study</strong><small>یادگیری و حل مسئله</small></span><span></span>
          </button>
        </div>
      </div>
      <div class="top-left">
        <button class="icon-btn" id="shareBtn" title="اشتراک‌گذاری گفتگو">↗</button>
        <button class="icon-btn" id="topMoreBtn" title="گزینه‌های بیشتر">⋯</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="logo-mark">R</div>
          <h1>سلام! چطور می‌تونم کمکت کنم؟</h1>
          <p>من RJF8 AI هستم؛ آماده‌ام برای یادگیری، ایده‌پردازی و حل مسئله همراهت باشم.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="یک ایده خلاقانه برای ساخت ویدیوی اینستاگرامی پیشنهاد بده.">
              <strong>🎬 ایده‌پردازی</strong><span>یک ایده جذاب برای ویدیو پیدا کن</span>
            </button>
            <button class="suggestion" data-prompt="یک موضوع درسی را خیلی ساده و مرحله‌به‌مرحله به من آموزش بده.">
              <strong>📚 یادگیری</strong><span>درس‌ها را ساده و قابل‌فهم یاد بگیر</span>
            </button>
            <button class="suggestion" data-prompt="یک سایت مدرن و جذاب طراحی کن و ساختارش را توضیح بده.">
              <strong>💻 برنامه‌نویسی</strong><span>برای پروژه بعدی‌ات کمک بگیر</span>
            </button>
            <button class="suggestion" data-prompt="یک داستان کوتاه طنز فارسی با پایان غافلگیرکننده بنویس.">
              <strong>💡 خلاقیت</strong><span>یک داستان یا ایده متفاوت بساز</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="composer-zone">
      <div class="composer-wrap">
        <div class="attachment-preview" id="attachmentPreview"></div>
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="هر چیزی که می‌خوای بپرس..." aria-label="پیام شما"></textarea>
          <div class="composer-tools">
            <div class="tools-right">
              <button class="tool-btn" id="attachBtn" title="افزودن فایل">＋</button>
              <input type="file" id="fileInput" multiple>
              <button class="tool-btn" id="voiceBtn" title="ورودی صوتی">🎙</button>
              <span style="font-size:11px;color:var(--muted)" id="modelLabel">RJF8 AI</span>
            </div>
            <div class="tools-left">
              <button class="tool-btn" id="clearPromptBtn" title="پاک کردن متن">⌫</button>
              <button class="tool-btn send-btn" id="sendBtn" title="ارسال پیام">↑</button>
            </div>
          </div>
        </div>
        <div class="disclaimer">RJF8 AI · برای ایده‌ها، یادگیری و خلاقیت<br>پاسخ‌ها با کمک هوش مصنوعی تولید می‌شوند و ممکن است نیاز به بررسی داشته باشند.</div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="dialog-backdrop" id="dialogBackdrop">
  <div class="dialog" id="dialog">
    <h2 id="dialogTitle"></h2>
    <div id="dialogContent"></div>
    <div class="dialog-actions" id="dialogActions"></div>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const STORAGE_KEY = "rjf8_ai_chats_v1";
const PREF_KEY = "rjf8_ai_preferences_v1";

let chats = [];
let activeId = null;
let selectedModel = "RJF8 AI";
let attachments = [];
let pendingAction = null;
let isGenerating = false;
let generationToken = 0;
let toastTimer;

const welcomeHTML = $("welcome").outerHTML;

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function saveChats(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));
  }catch(e){
    toast("فضای ذخیره‌سازی کافی نیست؛ گفتگوهای قدیمی‌تر را حذف کن.");
  }
}
function loadChats(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if(Array.isArray(data)){
      chats = data.filter(c => c && typeof c.id==="string" && Array.isArray(c.messages));
    }
  }catch(e){chats=[];}
}
function savePrefs(){
  try{
    localStorage.setItem(PREF_KEY,JSON.stringify({
      theme:document.body.classList.contains("light")?"light":"dark",
      model:selectedModel
    }));
  }catch(e){}
}
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
    if(p.theme==="light") document.body.classList.add("light");
    if(["RJF8 AI","RJF8 Creative","RJF8 Study"].includes(p.model)) selectedModel=p.model;
  }catch(e){}
  updateThemeUI();
  updateModelUI();
}
function toast(message){
  $("toast").textContent=message;
  $("toast").style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").style.display="none",2600);
}
function getActive(){
  return chats.find(c=>c.id===activeId)||null;
}
function sortChats(){
  chats.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
}
function newChat(){
  generationToken++;
  isGenerating=false;
  activeId=null;
  attachments=[];
  renderAttachments();
  $("prompt").value="";
  autoResize();
  renderHistory();
  renderMessages();
  closeSidebarMobile();
  $("prompt").focus();
}
function ensureChat(text){
  let chat=getActive();
  if(!chat){
    chat={id:uid(),title:text.trim().slice(0,36)||"گفتگوی جدید",messages:[],createdAt:Date.now(),updatedAt:Date.now(),model:selectedModel};
    chats.unshift(chat);
    activeId=chat.id;
  }
  return chat;
}
function formatText(text){
  // Escaping first keeps user and assistant text safe to display.
  let s=escapeHTML(text);
  s=s.replace(/```([\s\S]*?)```/g,(_,code)=>"<pre><code>"+code.trim()+"</code></pre>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*(.+?)\*/g,"<em>$1</em>");
  s=s.replace(/(^|\n)### (.+)/g,"$1<strong>$2</strong>");
  s=s.replace(/(^|\n)## (.+)/g,"$1<strong>$2</strong>");
  s=s.replace(/(^|\n)- (.+)/g,"$1• $2");
  s=s.replace(/\n/g,"<br>");
  return s;
}

function actionButton(symbol,label,callback){

}

function renderHistory(){
  const query=$("searchInput").value.trim().toLowerCase();
  const filtered=[...chats].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))
    .filter(c=>!query || c.title.toLowerCase().includes(query) ||
      c.messages.some(m=>(m.content||"").toLowerCase().includes(query)));
  $("history").innerHTML="";
  if(!filtered.length){
    const empty=document.createElement("div");
    empty.className="empty-history";
    empty.textContent=query?"گفتگویی پیدا نشد.":"گفتگوی قبلی نداری. یک چت جدید شروع کن!";
    $("history").appendChild(empty);
    return;
  }
  filtered.forEach(chat=>{
    const item=document.createElement("div");
    item.className="chat-item"+(chat.id===activeId?" active":"");
    const title=document.createElement("span");
    title.className="chat-title";
    title.textContent=chat.title;
    title.title=chat.title;
    title.addEventListener("click",()=>openChat(chat.id));
    const menu=document.createElement("button");
    menu.className="chat-menu";
    menu.textContent="⋯";
    menu.title="گزینه‌های گفتگو";
    menu.addEventListener("click",e=>{
      e.stopPropagation();
      showChatMenu(e.currentTarget,chat.id);
    });
    item.append(title,menu);
    item.addEventListener("dblclick",()=>renameChat(chat.id));
    $("history").appendChild(item);
  });

function showChatMenu(button,id){
  document.querySelectorAll(".context-menu").forEach(el=>el.remove());

  const menu=document.createElement("div");
  menu.className="context-menu";
  menu.style.top=Math.min(rect.bottom,window.innerHeight-150)+"px";
  menu.style.left=Math.max(8,rect.left-120)+"px";
  const opts=[
    ["✎ تغییر نام",()=>renameChat(id)],
    ["⇩ دریافت گفتگو",()=>exportChat(id)],
    ["▢ کپی گفتگو",()=>copyChat(id)],
    ["⌫ حذف گفتگو",()=>confirmDelete(id)]
  ];
  opts.forEach(([label,fn],i)=>{
    const b=document.createElement("button");
    b.textContent=label;
    if(i===3)b.className="danger";
    b.onclick=()=>{menu.remove();fn();};
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const close=e=>{if(!menu.contains(e.target)&&e.target!==button){menu.remove();document.removeEventListener("click",close);}};
  setTimeout(()=>document.addEventListener("click",close),0);

function regenerate(index){
  const chat=getActive();if(!chat||isGenerating)return;
  let userIndex=index-1;
  while(userIndex>=0 && chat.messages[userIndex].role!=="user")userIndex--;
  if(userIndex<0)return;
  chat.messages=chat.messages.slice(0,userIndex+1);
  saveChats();renderMessages();
  generateReply(chat.id,chat.messages[userIndex].content);
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast("کپی شد!")).catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){

  document.body.appendChild(area);area.select();
  try{document.execCommand("copy");toast("کپی شد!");}
  catch(e){toast("کپی خودکار ممکن نشد؛ متن را انتخاب کن.");}
  area.remove();
}

function downloadText(filename,text,type="text/plain;charset=utf-8"){
  const blob=new Blob(["\uFEFF",text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function sendMessage(){
  if(isGenerating)return;
  const text=$("prompt").value.trim();
  if(!text && !attachments.length)return;
  const chat=ensureChat(text||"فایل‌های پیوست‌شده");
  const fileNames=attachments.map(f=>f.name);
  chat.messages.push({role:"user",content:text||"فایل پیوست شد.",files:fileNames});
  if(chat.messages.length===1 && text){
    chat.title=text.replace(/\s+/g," ").slice(0,36)+(text.length>36?"…":"");
  }
  chat.model=selectedModel;
  chat.updatedAt=Date.now();
  const id=chat.id;
  const submittedText=text;
  $("prompt").value="";
  attachments=[];
  renderAttachments();autoResize();
  saveChats();renderHistory();renderMessages();
  generateReply(id,submittedText);
}
async function generateReply(chatId,text){
  const chat=chats.find(c=>c.id===chatId);
  if(!chat)return;
  isGenerating=true;
  const token=++generationToken;
  renderMessages();

  try{
    const messages=chat.messages
      .filter(m=>m && (m.role==="user" || m.role==="assistant") && typeof m.content==="string")
      .map(m=>({role:m.role,content:m.content}));

    // اتصال RJF8 AI به هوش مصنوعی Cloudflare
    const response=await fetch("https://rjf8ai.rjf8rjf8rjf8rjf8.workers.dev/",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages})
    });

    let data={};
    try{data=await response.json();}catch(e){}
    if(token!==generationToken)return;

    if(!response.ok){
      throw new Error(data.error || "پاسخ‌گویی ناموفق بود ("+response.status+").");
    }
    const reply=typeof data.reply==="string" ? data.reply.trim() : "";
    if(!reply)throw new Error(data.error || "هوش مصنوعی پاسخ خالی برگرداند.");

    const currentChat=chats.find(c=>c.id===chatId);
    if(!currentChat)return;
    currentChat.messages.push({role:"assistant",content:reply});
    currentChat.updatedAt=Date.now();
  }catch(error){
    if(token!==generationToken)return;
    const currentChat=chats.find(c=>c.id===chatId);
    if(currentChat){
      let message="اتصال به هوش مصنوعی ناموفق بود.\n\n";
      if(error && error.message && !/Failed to fetch|NetworkError/i.test(error.message)){
        message+="جزئیات خطا: "+error.message+"\n\n";
      } else {
        message+="مرورگر نتونست پاسخ Worker را بخونه. معمولاً علتش تنظیم نبودن CORS، منتشر نشدن کد جدید Worker، یا خطای Worker است.\n\n";
      }
      message+="اگر کد Worker را با نسخهٔ جدید جایگزین کردی، مطمئن شو Binding هوش مصنوعی با نام AI هم اضافه شده باشد.";
      currentChat.messages.push({role:"assistant",content:message});
      currentChat.updatedAt=Date.now();
    }
  }finally{
    if(token===generationToken){
      isGenerating=false;
      saveChats();
      renderHistory();
      if(activeId===chatId)renderMessages();
    }
  }
}

$("newChatBtn").onclick=newChat;
$("menuBtn").onclick=toggleSidebar;
$("closeSidebar").onclick=closeSidebarMobile;
$("overlay").onclick=closeSidebarMobile;
$("themeBtn").onclick=toggleTheme;
$("settingsBtn").onclick=settingsDialog;
$("exportAllBtn").onclick=exportAll;
$("shareBtn").onclick=shareChat;
$("exploreBtn").onclick=exploreIdeas;
$("profileBtn").onclick=()=>showDialog("درباره RJF8 AI",
  "<p><strong>RJF8 AI</strong><br>دستیار شخصی با طراحی مدرن برای گفتگو، یادگیری و خلاقیت.</p>",
  [{label:"باشه",primary:true,action:closeDialog}]);
$("topMoreBtn").onclick=()=>{
  const chat=getActive();
  if(!chat){toast("اول یک گفتگو شروع کن.");return;}
  showDialog("گزینه‌های گفتگو",'<p>چه کاری می‌خوای انجام بدی؟</p>',[
    {label:"تغییر نام",action:()=>{closeDialog();renameChat(chat.id);}},
    {label:"دریافت فایل",action:()=>{closeDialog();exportChat(chat.id);}},
    {label:"حذف گفتگو",action:()=>{closeDialog();confirmDelete(chat.id);}},
    {label:"بستن",action:closeDialog}
  ]);
};
$("modelBtn").onclick=e=>{$("modelMenu").classList.toggle("show");};
document.querySelectorAll(".model-option").forEach(b=>b.onclick=()=>{
  selectedModel=b.dataset.model;savePrefs();updateModelUI();$("modelMenu").classList.remove("show");
  const chat=getActive();if(chat){chat.model=selectedModel;saveChats();}
});
document.addEventListener("click",e=>{
  if(!$("modelMenu").contains(e.target)&&!$("modelBtn").contains(e.target))
    $("modelMenu").classList.remove("show");
  if(!e.target.closest(".chat-item")&&!e.target.closest(".context-menu"))
    document.querySelectorAll(".context-menu").forEach(el=>el.remove());
});
$("searchBtn").onclick=()=>{
  $("searchWrap").hidden=!$("searchWrap").hidden;
  if(!$("searchWrap").hidden)$("searchInput").focus();
  else{$("searchInput").value="";renderHistory();}
};
$("searchInput").addEventListener("input",renderHistory);
$("sendBtn").onclick=sendMessage;
$("prompt").addEventListener("input",autoResize);
$("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
$("clearPromptBtn").onclick=()=>{$("prompt").value="";autoResize();$("prompt").focus();};
$("attachBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{
  const incoming=Array.from(e.target.files||[]);
  attachments.push(...incoming);
  renderAttachments();e.target.value="";
};
$("dialogBackdrop").addEventListener("click",e=>{
  if(e.target===$("dialogBackdrop"))closeDialog();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeDialog();$("modelMenu").classList.remove("show");closeSidebarMobile();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();$("searchWrap").hidden=false;$("searchInput").focus();
  }
});
$("voiceBtn").onclick=()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){toast("ورودی صوتی در این مرورگر پشتیبانی نمی‌شود.");return;}
  try{
    const rec=new SpeechRecognition();
    rec.lang="fa-IR";rec.interimResults=false;
    $("voiceBtn").textContent="⏺";
    rec.onresult=e=>{
      $("prompt").value+=($("prompt").value?" ":"")+e.results[0][0].transcript;
      autoResize();
    };
    rec.onerror=()=>toast("ضبط صدا انجام نشد. اجازه میکروفون را بررسی کن.");
    rec.onend=()=>$("voiceBtn").textContent="🎙";
    rec.start();
  }catch(e){toast("امکان شروع ضبط صدا وجود ندارد.");}
};

// Start
loadPrefs();
loadChats();
renderHistory();
renderMessages();
autoResize();
})();
</script>
</body>
</html>
