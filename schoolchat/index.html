<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>SchoolChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#f3f5f9;
  --card:rgba(255,255,255,.72);
  --card-solid:#fff;
  --text:#111827;
  --muted:#7b8494;
  --line:rgba(20,30,50,.08);
  --accent:#1677ff;
  --accent2:#5b5ff5;
  --bubble:#e9f1ff;
  --bubble-me:#1677ff;
  --bubble-me-text:#fff;
  --danger:#ff3b30;
  --shadow:0 15px 45px rgba(20,30,50,.09);
}

body.dark{
  --bg:#080a0f;
  --card:rgba(22,25,33,.76);
  --card-solid:#151820;
  --text:#f4f6fa;
  --muted:#9299a8;
  --line:rgba(255,255,255,.08);
  --accent:#4c91ff;
  --accent2:#7c72ff;
  --bubble:#202632;
  --bubble-me:#266fd8;
  --bubble-me-text:#fff;
  --shadow:0 20px 55px rgba(0,0,0,.35);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}

/* AUTH */

#authScreen{
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at 20% 10%,rgba(22,119,255,.17),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(124,114,255,.18),transparent 35%),
    var(--bg);
}

.authCard{
  width:min(430px,100%);
  padding:30px 22px;
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-radius:30px;
  box-shadow:var(--shadow);
}

.logo{
  width:68px;
  height:68px;
  border-radius:22px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:25px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px rgba(22,119,255,.28);
}

.authCard h1{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.authCard p{
  text-align:center;
  color:var(--muted);
  margin:0 0 25px;
}

.field{
  margin-bottom:12px;
}

.field input{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  outline:none;
  border-radius:17px;
  padding:0 17px;
  background:var(--card-solid);
  color:var(--text);
}

.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(22,119,255,.1);
}

.primary{
  width:100%;
  height:54px;
  border-radius:17px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 25px rgba(22,119,255,.2);
}

.authSwitch{
  text-align:center;
  margin-top:17px;
  color:var(--muted);
}

.linkBtn{
  background:none;
  color:var(--accent);
  font-weight:800;
}

/* MAIN */

#mainScreen{
  flex-direction:column;
}

.topbar{
  height:74px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  z-index:10;
}

.topLeft,.topRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.iconBtn{
  width:44px;
  height:44px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:transparent;
  color:var(--text);
  font-size:21px;
}

.iconBtn:active{
  transform:scale(.94);
  background:var(--line);
}

.titleBox{
  text-align:right;
}

.titleBox strong{
  display:block;
  font-size:18px;
}

.titleBox span{
  font-size:12px;
  color:var(--muted);
}

.content{
  flex:1;
  overflow-y:auto;
  padding:14px 14px 100px;
  overscroll-behavior:contain;
}

.searchBox{
  height:49px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:17px;
  background:var(--card);
  backdrop-filter:blur(18px);
  margin-bottom:18px;
}

.searchBox input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 2px 10px;
}

.sectionHead h2{
  margin:0;
  font-size:17px;
}

.sectionHead span{
  color:var(--muted);
  font-size:12px;
}

/* CARDS */

.horizontal{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:4px;
}

.horizontal::-webkit-scrollbar{
  display:none;
}

.groupCard{
  min-width:185px;
  padding:17px;
  border-radius:22px;
  background:
    linear-gradient(145deg,rgba(22,119,255,.95),rgba(91,95,245,.95));
  color:#fff;
  box-shadow:0 14px 30px rgba(22,119,255,.19);
  text-align:right;
}

.groupIcon{
  width:45px;
  height:45px;
  border-radius:15px;
  background:rgba(255,255,255,.18);
  display:grid;
  place-items:center;
  font-size:22px;
  margin-bottom:13px;
}

.groupCard strong{
  display:block;
  font-size:16px;
}

.groupCard small{
  display:block;
  margin-top:5px;
  opacity:.78;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.userRow{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 7px;
  border-bottom:1px solid var(--line);
}

.avatar{
  width:50px;
  height:50px;
  flex-shrink:0;
  border-radius:17px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(145deg,#5c83ff,#765cf4);
}

.userInfo{
  flex:1;
  min-width:0;
}

.userInfo strong{
  display:block;
  font-size:15px;
}

.userInfo span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.rowAction{
  min-width:42px;
  height:42px;
  border-radius:14px;
  color:var(--accent);
  background:rgba(22,119,255,.09);
}

/* BOTTOM NAV */

.bottomNav{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:68px;
  border:1px solid var(--line);
  border-radius:23px;
  background:var(--card);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:20;
}

.navItem{
  flex:1;
  height:100%;
  background:none;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:20px;
}

.navItem span{
  font-size:10px;
}

.navItem.active{
  color:var(--accent);
}

/* CHAT */

#chatScreen{
  flex-direction:column;
  background:var(--bg);
}

.chatHeader{
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(24px);
  z-index:10;
}

.chatHeaderInfo{
  flex:1;
  min-width:0;
}

.chatHeaderInfo strong{
  display:block;
  font-size:16px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chatHeaderInfo span{
  color:var(--muted);
  font-size:11px;
}

.chatMessages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.messageWrap{
  max-width:84%;
  display:flex;
  flex-direction:column;
}

.messageWrap.me{
  align-self:flex-start;
  align-items:flex-start;
}

.messageWrap.them{
  align-self:flex-end;
  align-items:flex-end;
}

.message{
  padding:10px 13px;
  border-radius:18px;
  background:var(--bubble);
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.me .message{
  background:var(--bubble-me);
  color:var(--bubble-me-text);
  border-bottom-left-radius:6px;
}

.them .message{
  border-bottom-right-radius:6px;
}

.messageMeta{
  color:var(--muted);
  font-size:9px;
  margin:3px 7px 0;
}

.messageActions{
  display:flex;
  gap:5px;
  margin-top:4px;
}

.messageActions button{
  font-size:10px;
  color:var(--muted);
  background:transparent;
}

.composer{
  flex-shrink:0;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;
  align-items:flex-end;
  gap:8px;
  border-top:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(24px);
}

.composer textarea{
  flex:1;
  min-height:46px;
  max-height:120px;
  resize:none;
  border:1px solid var(--line);
  border-radius:18px;
  outline:none;
  padding:12px 14px;
  background:var(--card-solid);
  color:var(--text);
}

.sendBtn{
  width:47px;
  height:47px;
  flex-shrink:0;
  border-radius:17px;
  color:white;
  background:var(--accent);
  font-size:19px;
}

/* DRAWER */

.drawer{
  position:absolute;
  z-index:100;
  top:0;
  bottom:0;
  right:0;
  width:min(340px,88%);
  background:var(--card-solid);
  border-left:1px solid var(--line);
  transform:translateX(105%);
  transition:.28s ease;
  box-shadow:-20px 0 50px rgba(0,0,0,.15);
  padding:20px 14px;
}

.drawer.open{
  transform:translateX(0);
}

.overlay{
  position:absolute;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.38);
  display:none;
}

.overlay.show{
  display:block;
}

.drawerProfile{
  padding:20px 12px;
  border-radius:23px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  color:#fff;
  margin-bottom:18px;
}

.drawerAvatar{
  width:58px;
  height:58px;
  border-radius:19px;
  background:rgba(255,255,255,.18);
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:900;
  margin-bottom:12px;
}

.drawerProfile strong{
  display:block;
  font-size:18px;
}

.drawerProfile span{
  display:block;
  opacity:.78;
  font-size:12px;
  margin-top:4px;
}

.drawerItem{
  width:100%;
  height:52px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 14px;
  border-radius:16px;
  background:transparent;
  color:var(--text);
  text-align:right;
  margin-bottom:5px;
}

.drawerItem:active{
  background:var(--line);
}

.drawerItem .ico{
  width:30px;
  text-align:center;
  font-size:20px;
}

/* MODAL */

.modal{
  position:absolute;
  inset:0;
  z-index:200;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.4);
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(560px,100%);
  max-height:88%;
  overflow-y:auto;
  padding:18px;
  background:var(--card-solid);
  border-radius:28px 28px 0 0;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
}

.sheetHandle{
  width:42px;
  height:5px;
  border-radius:10px;
  background:var(--line);
  margin:0 auto 18px;
}

.sheet h2{
  margin:0 0 18px;
  font-size:20px;
}

.settingsRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:58px;
  border-bottom:1px solid var(--line);
}

.settingsRow span{
  color:var(--muted);
  font-size:13px;
}

.toggle{
  width:51px;
  height:31px;
  border-radius:20px;
  background:#c7cbd3;
  padding:3px;
  transition:.2s;
}

.toggle i{
  display:block;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

.toggle.on{
  background:var(--accent);
}

.toggle.on i{
  transform:translateX(-20px);
}

/* TOAST */

#toast{
  position:absolute;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  background:#1b1d22;
  color:#fff;
  padding:11px 16px;
  border-radius:15px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.emptyIcon{
  font-size:42px;
  margin-bottom:12px;
}

/* RESPONSIVE */

@media(min-width:700px){
  .content{
    max-width:900px;
    width:100%;
    margin:auto;
  }

  .chatMessages{
    max-width:900px;
    width:100%;
    margin:auto;
  }

  .composer{
    padding-left:max(10px,calc((100% - 900px)/2));
    padding-right:max(10px,calc((100% - 900px)/2));
  }
}
</style>
</head>

<body>

<div id="app">

<!-- AUTH -->
<section id="authScreen" class="screen active">

  <div class="authCard">

    <div class="logo">SC</div>

    <h1 id="authTitle">ورود</h1>
    <p id="authSubtitle">به SchoolChat خوش آمدید</p>

    <div class="field" id="displayNameField" style="display:none">
      <input id="displayNameInput" placeholder="نام نمایشی">
    </div>

    <div class="field">
      <input id="emailInput" type="email" placeholder="ایمیل">
    </div>

    <div class="field">
      <input id="passwordInput" type="password" placeholder="رمز عبور">
    </div>

    <div class="field" id="usernameField" style="display:none">
      <input id="usernameInput" placeholder="نام کاربری">
    </div>

    <button class="primary" id="authBtn">ورود</button>

    <div class="authSwitch">
      <span id="switchText">حساب ندارید؟</span>
      <button class="linkBtn" id="switchBtn">ثبت‌نام</button>
    </div>

  </div>
</section>


<!-- MAIN -->
<section id="mainScreen" class="screen">

  <header class="topbar">

    <div class="topLeft">
      <button class="iconBtn" id="menuBtn">☰</button>

      <div class="titleBox">
        <strong id="pageTitle">خانه</strong>
        <span id="pageSubtitle">SchoolChat</span>
      </div>
    </div>

    <div class="topRight">
      <button class="iconBtn" id="themeBtn">☼</button>
    </div>

  </header>


  <main class="content" id="mainContent"></main>


  <nav class="bottomNav">

    <button class="navItem active" data-page="home">
      <b>⌂</b>
      <span>خانه</span>
    </button>

    <button class="navItem" data-page="chats">
      <b>◌</b>
      <span>مکالمات</span>
    </button>

    <button class="navItem" data-page="groups">
      <b>♧</b>
      <span>گروه‌ها</span>
    </button>

    <button class="navItem" data-page="search">
      <b>⌕</b>
      <span>جست‌وجو</span>
    </button>

  </nav>


  <!-- DRAWER -->
  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer">

    <div class="drawerProfile">
      <div class="drawerAvatar" id="drawerAvatar">R</div>
      <strong id="drawerName">کاربر</strong>
      <span id="drawerUsername">@username</span>
    </div>

    <button class="drawerItem" id="profileBtn">
      <span class="ico">◉</span>
      <span>پروفایل</span>
    </button>

    <button class="drawerItem" id="settingsBtn">
      <span class="ico">⚙</span>
      <span>تنظیمات</span>
    </button>

    <button class="drawerItem" id="logoutBtn">
      <span class="ico">⇥</span>
      <span>خروج از حساب</span>
    </button>

  </aside>

</section>


<!-- CHAT -->
<section id="chatScreen" class="screen">

  <header class="chatHeader">

    <button class="iconBtn" id="chatBack">‹</button>

    <div class="avatar" id="chatAvatar">S</div>

    <div class="chatHeaderInfo">
      <strong id="chatTitle">گفت‌وگو</strong>
      <span id="chatSubtitle">آنلاین</span>
    </div>

  </header>

  <main class="chatMessages" id="chatMessages"></main>

  <div class="composer">

    <textarea
      id="messageInput"
      rows="1"
      placeholder="پیام بنویسید..."
    ></textarea>

    <button class="sendBtn" id="sendBtn">➤</button>

  </div>

</section>


<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">

  <div class="sheet">

    <div class="sheetHandle"></div>

    <h2>پروفایل من</h2>

    <div class="field">
      <input id="profileDisplayName" placeholder="نام نمایشی">
    </div>

    <div class="field">
      <input id="profileUsername" placeholder="نام کاربری">
    </div>

    <button class="primary" id="saveProfileBtn">
      ذخیره تغییرات
    </button>

  </div>

</div>


<!-- SETTINGS -->
<div class="modal" id="settingsModal">

  <div class="sheet">

    <div class="sheetHandle"></div>

    <h2>تنظیمات</h2>

    <div class="settingsRow">
      <div>
        <b>حالت شب</b>
        <br>
        <span>ظاهر تیره برای استفاده در شب</span>
      </div>

      <button class="toggle" id="darkToggle">
        <i></i>
      </button>
    </div>

  </div>

</div>


<!-- TOAST -->
<div id="toast"></div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://csotldngbndpsuprtqzk.supabase.co";

const SUPABASE_KEY =
"sb_publishable__RAL-B5EQwYhqfYv2NBMiQ_eUpmEM7G";

const { createClient } =
supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATE
========================= */

let currentUser = null;
let currentProfile = null;

let currentPage = "home";

let chatMode = null;
let chatTarget = null;

let privateChannel = null;
let groupChannel = null;

let isSignup = false;

let groupsCache = [];
let usersCache = [];

let conversationUsers = [];


/* =========================
   HELPERS
========================= */

const $ = id => document.getElementById(id);

function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>el.classList.remove("show"),
      2600
    );
}

function showScreen(id){

  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  $(id).classList.add("active");
}

function initials(name){

  if(!name) return "?";

  return name.trim().slice(0,1).toUpperCase();
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(date){

  return new Date(date)
    .toLocaleTimeString("fa-IR",{
      hour:"2-digit",
      minute:"2-digit"
    });
}


/* =========================
   AUTH
========================= */

$("switchBtn").onclick = ()=>{

  isSignup = !isSignup;

  $("authTitle").textContent =
    isSignup ? "ساخت حساب" : "ورود";

  $("authSubtitle").textContent =
    isSignup
      ? "حساب خود را ایجاد کنید"
      : "به SchoolChat خوش آمدید";

  $("displayNameField").style.display =

$("authBtn").onclick = async ()=>{

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  if(!email || !password){

    toast("ایمیل و رمز عبور را وارد کنید");

    return;
  }

  $("authBtn").disabled = true;

  try{

    if(isSignup){

      const displayName =
        $("displayNameInput").value.trim();

      const username =
        $("usernameInput").value.trim();

      if(!displayName || !username){

        toast("نام و نام کاربری را وارد کنید");

        return;
      }

      const {data,error} =
        await db.auth.signUp({
          email,
          password
        });

      if(error) throw error;

      if(!data.user){

        toast("ثبت‌نام انجام شد");

        return;
      }

      const {error:profileError} =
        await db
        .from("profiles")
        .insert({
          id:data.user.id,
          username,
          display_name:displayName
        });

      if(profileError){

        if(
          profileError.code === "23505"
        ){

          toast("این نام کاربری قبلاً استفاده شده");

        }else{

          throw profileError;
        }

        return;
      }

      toast("حساب ساخته شد");

    }else{

      const {error} =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      await bootApp();
    }

  }catch(error){

    console.error(error);

    toast(
      translateError(error.message)
    );

  }finally{

    $("authBtn").disabled = false;
  }
};

  showScreen("mainScreen");

  updateDrawer();

db.auth.onAuthStateChange(

      session &&
      !currentUser

);

async function buildConversations(){

  const {data,error} =
    await db
    .from("messages")
    .select("sender_id,receiver_id,created_at")
    .or(
      `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
    )
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    conversationUsers = [];

    return;
  }

  const ids = [];

  for(const m of data || []){

    const id =
      m.sender_id === currentUser.id
        ? m.receiver_id
        : m.sender_id;

    if(!ids.includes(id))
      ids.push(id);
  }

  if(!ids.length){

    conversationUsers = [];

    return;
  }

  const {data:users} =
    await db
    .from("profiles")
    .select("*")
    .in("id",ids);

  conversationUsers =
    ids
    .map(id =>
      (users || []).find(x=>x.id===id)
    )
    .filter(Boolean);
}

async function openPrivateChat(userId){

  const {data:user,error} =
    await db
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .single();

  if(error || !user){

    toast("کاربر پیدا نشد");

    return;
  }

  chatMode = "private";

  chatTarget = user;

  $("chatTitle").textContent =
    user.display_name ||
    user.username;

  $("chatSubtitle").textContent =
    "@" + user.username;

  $("chatAvatar").textContent =
    initials(
      user.display_name ||
      user.username
    );

  showScreen("chatScreen");

  await loadPrivateMessages();

  subscribePrivate(userId);
}


async function loadPrivateMessages(){

  const {data,error} =
    await db
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatTarget.id}),and(sender_id.eq.${chatTarget.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    toast("خطا در دریافت پیام‌ها");

    return;
  }

  renderMessages(
    data || [],
    currentUser.id
  );
}


function renderMessages(messages,myId){

  const box =

  if(!messages.length){

    box.innerHTML = `

        <div class="emptyIcon">✉</div>

    `;

        m.sender_id === myId;

        <div

          data-id="${m.id}"
        >

          <div class="message">
            ${escapeHTML(m.content)}
          </div>

            mine

            `
            <div class="messageActions">

                onclick="editMessage(${m.id},'private')"
              >

                onclick="deleteMessage(${m.id},'private')"

/* =========================
   REALTIME
========================= */

function setupRealtime(){

  if(privateChannel)
    db.removeChannel(privateChannel);

  if(groupChannel)
    db.removeChannel(groupChannel);
}


function subscribePrivate(userId){

  if(privateChannel)
    db.removeChannel(privateChannel);

  privateChannel =
    db
    .channel(
      "private-" +
      currentUser.id +
      "-" +
      userId
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      payload=>{

        const row =
          payload.new ||
          payload.old;

        if(!row) return;

        const related =
          (
            row.sender_id === currentUser.id &&
            row.receiver_id === userId
          )
          ||
          (
            row.sender_id === userId &&
            row.receiver_id === currentUser.id
          );

        if(!related) return;

        loadPrivateMessages();

      }
    )
    .subscribe();
}


function subscribeGroup(groupId){

  if(groupChannel)
    db.removeChannel(groupChannel);

  groupChannel =
    db
    .channel(
      "group-" + groupId
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"group_messages",
        filter:
          "group_id=eq." + groupId
      },
      ()=>{
        loadGroupMessages(groupId);
      }
    )
    .subscribe();
}

   MESSAGE ACTIONS
========================= */

async function copyMessage(id){

  const el =
    document.querySelector(
      `[data-id="${id}"] .message`
    );

  if(!el) return;

  try{

    await navigator.clipboard.writeText(
      el.textContent
    );

    toast("پیام کپی شد");

  }catch{

    toast("کپی انجام نشد");
  }
}


async function editMessage(id,type){

  const el =
    document.querySelector(
      `[data-id="${id}"] .message`
    );

  if(!el) return;

  const old =
    el.textContent;

  const value =
    prompt(
      "متن جدید پیام:",
      old
    );

  if(
    value === null ||
    !value.trim()
  ) return;

  if(type === "private"){

    const {error} =
      await db
      .from("messages")
      .update({
        content:value.trim()
      })
      .eq("id",id)
      .eq("sender_id",currentUser.id);

    if(error){

      toast("ویرایش انجام نشد");

      return;
    }

    await loadPrivateMessages();
  }
}


async function deleteMessage(id,type){

  if(
    !confirm("پیام حذف شود؟")
  ) return;

  if(type === "private"){

    const {error} =
      await db
      .from("messages")
      .delete()
      .eq("id",id)
      .eq("sender_id",currentUser.id);

    if(error){

      toast("حذف انجام نشد");

      return;
    }

    await loadPrivateMessages();
  }
}

    currentProfile.username || "";

  $("profileModal")
    .classList.add("show");
};


$("saveProfileBtn").onclick =
async ()=>{

  const display_name =
    $("profileDisplayName")
      .value.trim();

  const username =
    $("profileUsername")
      .value.trim();

  if(!display_name || !username){

    toast("اطلاعات را کامل کنید");

    return;
  }

  const {data,error} =
    await db
    .from("profiles")
    .update({
      display_name,
      username
    })
    .eq("id",currentUser.id)
    .select()
    .single();

  if(error){

    console.error(error);

    if(error.code === "23505")
      toast("این نام کاربری قبلاً استفاده شده");
    else
      toast("ذخیره انجام نشد");

    return;
  }

  currentProfile = data;

  updateDrawer();

  $("profileModal")
    .classList.remove("show");

  toast("پروفایل ذخیره شد");

  if(currentPage === "home")
    renderHome();

};


/* =========================
   SETTINGS / THEME
========================= */

function applyTheme(){

  const dark =
    localStorage.getItem("schoolchat_theme")
    === "dark";

  document.body.classList.toggle(
    "dark",
    dark
  );

  $("darkToggle")
    .classList.toggle("on",dark);

  $("themeBtn").textContent =
    dark ? "☾" : "☼";
}


function toggleTheme(){

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "schoolchat_theme",
    dark ? "light" : "dark"
  );

  applyTheme();
}


$("themeBtn").onclick =
  toggleTheme;

$("darkToggle").onclick =
  toggleTheme;

$("settingsBtn").onclick = ()=>{

  closeDrawer();

  applyTheme();

  $("settingsModal")
    .classList.add("show");
};


/* =========================
   DRAWER
========================= */

$("menuBtn").onclick = ()=>{

  $("drawer")
    .classList.add("open");

  $("overlay")
    .classList.add("show");
};


function closeDrawer(){

  $("drawer")
    .classList.remove("open");

  $("overlay")
    .classList.remove("show");
}


$("overlay").onclick =
  closeDrawer;


$("logoutBtn").onclick =
async ()=>{

  closeDrawer();

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;

  showScreen("authScreen");
};


/* =========================
   CHAT BACK
========================= */

$("chatBack").onclick = ()=>{

  if(privateChannel){

    db.removeChannel(
      privateChannel
    );

    privateChannel = null;
  }

  if(groupChannel){

    db.removeChannel(
      groupChannel
    );

    groupChannel = null;
  }

  showScreen("mainScreen");

  renderPage(currentPage);
};


/* =========================
   MODALS
========================= */

document
.querySelectorAll(".modal")
.forEach(modal=>{

  modal.addEventListener(
    "click",
    e=>{

      if(e.target === modal)
        modal.classList.remove("show");

    }
  );

});


/* =========================
   SCROLL
========================= */

function scrollMessages(){

  const box =
    $("chatMessages");

  requestAnimationFrame(()=>{
    box.scrollTop =
      box.scrollHeight;
  });
}


/* =========================
   ERROR TRANSLATION
========================= */

function translateError(message){

  const m =
    String(message || "");

  if(
    m.includes("Invalid login credentials")
  )
    return "ایمیل یا رمز عبور اشتباه است";

  if(
    m.includes("User already registered")
  )
    return "این ایمیل قبلاً ثبت شده است";

  if(
    m.includes("Password should be at least")
  )
    return "رمز عبور کوتاه است";

  if(
    m.includes("duplicate key")
  )
    return "این اطلاعات قبلاً استفاده شده است";

  return m || "خطایی رخ داد";
}


/* =========================
   START
========================= */

applyTheme();

(async()=>{

  const {
    data:{session}
  } = await db.auth.getSession();

  if(session){

    await bootApp();

  }else{

    showScreen("authScreen");
  }

})();

</script>

</body>
</html>
